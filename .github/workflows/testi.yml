name: testi

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Namestitev odvisnosti
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff — statična analiza
        run: python -m ruff check .
      - name: mypy — baseline ratchet (brez novih napak)
        run: python scripts/preveri_mypy.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Testi s coverage (ratchet prag 65 %)
        # -n auto: vzporedno (varnost preverjena — testi pišejo v tmp_path);
        # pytest-cov združi podatke delavcev, prag velja na skupno pokritost.
        run: python -m pytest tests/ -q -n auto --cov
        env:
          PYTHONIOENCODING: utf-8