name: testi

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Namestitev odvisnosti
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff — statična analiza
        run: python -m ruff check .
      - name: mypy — baseline ratchet (brez novih napak)
        run: python scripts/preveri_mypy.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Testi s coverage (ratchet prag 65 %)
        run: python -m pytest tests/ -q --cov
        env:
          PYTHONIOENCODING: utf-8