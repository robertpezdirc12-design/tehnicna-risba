id: orodja
opis: |
  V datoteki orodja.py je funkcija povprecje(vrednosti), ki sproži
  NotImplementedError. Implementiraj jo (povprecje seznama števil).
  Funkcija sestej v vozlice.py mora ostati delujoča.
predloga: ../primeri/knjiznica3
fail_to_pass:
  - test_povprecje_osnovno
  - test_povprecje_en_element
pass_to_pass:
  - test_sestej_ostane
cas_s: 20
opombe: |
  Večdatotečna naloga: popravek je v orodja.py, zaščita pa preverja
  nespremenjeno vozlice.py.
