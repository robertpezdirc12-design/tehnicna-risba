# Projektni metapodatki (strojno berljiva licenca) + konfiguracija orodij.
# Licenca izdelka je MIT; licence vgrajenih knjižnic so v
# THIRD_PARTY_NOTICES.md in jih preverja scripts/preveri_licence.py.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tehnicna-risba"
version = "1.5.4"
description = "Generator tehnicnih risb, razreza in 3D modelov za WPC ograje"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Robert Pezdirc" }]
keywords = ["ograje", "wpc", "tehnicna risba", "dxf", "razrez", "3d"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[tool.setuptools]
# Repozitorij ni knjižnica: moduli se izvajajo iz korena (vmesnik.py, risba.py).
py-modules = []

# Konfiguracija orodij (UI/UX raziskava — Plan 1: quality gates)
# Viri: Modern Python standard (TS3: coverage merjen samo v CI),
# Python Tooling Stack 2026 (ruff + mypy postopno), SQRBOK (ratchet prag).

[tool.ruff]
# Pravila: sintaktične/varnostne napake in neuporabljeni uvozi (F),
# očitne napake (E9). Stilnih pravil NE vsiljujemo (ni ruff format).
line-length = 88
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6"]
# Slogovna pravila, ki ne odkrivajo napak — namerno izključena:
# E741 (ime `l`), E702 (več stavkov v vrstici), E731 (lambda) —
# preimenovanja v risarski kodi bi bila tvegana brez funkcionalne koristi.
ignore = ["E741", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
# Testi: uvozi po skip-stražarjih (tkinter okolje) so namerni.
"tests/*" = ["E402"]
"photo_fence_proposal/testi_pfp.py" = ["E402"]

[tool.mypy]
# Postopna tipizacija (SQRBOK vzor): preveri definicije brez tipov,
# ne zahteva tipov povsod. --strict je ločen večji projekt.
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
# scripts/preizkusi_gui.py je testni voznik z NAMERNIM monkeypatchanjem
# dialogov (filedialog/messagebox) — tipi se preverjajo v aplikacijskih
# modulih, zato je voznik izključen iz mypy.
exclude = ["build/", "dist/", "scripts/preizkusi_gui\\.py"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "build/*", "dist/*", "test_*", "_*"]

[tool.coverage.report]
# RATCHET (SQRBOK): prag = trenutna pokritost (70 %) zaokrožena NAVZDOL na 5,
# minus rezerva za okoljsko nihanje (Tk testi občasno preskočeni → 61–70 %).
# Dviguje se ročno, ko pokritost zraste — nikoli ne blokira PR-ja,
# ki ne spremeni ničesar.
fail_under = 65

[tool.pytest.ini_options]
# pytest-timeout: zaščita pred zataknjenimi testi (omejitev velja na test).
timeout = 600
markers = [
    "pocasi: počasnejši testi (večstransko generiranje PDF) — hitra zanka: -m 'not pocasi'",
]