# Cene za predračun (EUR) — stran 3 PDF-a na spletnem generatorju.
#
# POZOR: ta datoteka je v JAVNEM repozitoriju — tvoje cene so vidne!
# Če nočeš pokazati cen, preimenuj ali izbriši to datoteko
# (spletni generator potem naredi samo risbo + montažni list).
#
# Prazno polje v formi stranke = postavka ni v predračunu.

wpc_deska_m: 24.50      # WPC deska, EUR na meter porabe
alu_m: 18.00            # aluminijev profil, EUR na meter
rocaj_kos: 45.00        # ročaj, EUR na kos
nosilec_kos: 12.00      # nosilni nosilec/konzola, EUR na kos
vijak_kos: 0.90         # vijak M8×70, EUR na kos
fasadni_kos: 1.20       # fasadni vijak Ø8×80 + tipel, EUR na kos
anker_kos: 1.50         # anker M10, EUR na kos
osnova_kos: 15.00       # osnova za steber, EUR na kos

# delo (neobvezno — če je prazno, predračun ne vsebuje postavke "delo")
dela_ur_cena: 35.00     # EUR / ura
dela_ure: 12            # ocena ur (sicer oceni montažer)
